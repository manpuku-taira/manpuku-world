<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Manpuku World</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>

  <!-- タイトル画面 -->
  <div id="title" class="screen active">
    <div id="titleInner">
      <!-- ロゴはJSが自動で img を差し込みます（title.PNG / title.png） -->
      <div id="titleArt" aria-hidden="true"></div>

      <button id="btnStart" class="btn primary" type="button">START</button>
      <div class="hint">※STARTが押せない端末向け：画面のどこをタップしても開始できます</div>
    </div>
  </div>

  <!-- ゲーム画面 -->
  <div id="game" class="screen">
    <header id="hud">
      <div class="chips">
        <span id="chipTurn" class="chip">TURN 1</span>
        <span id="chipPhase" class="chip">START</span>
        <span id="chipActive" class="chip">YOUR TURN</span>
      </div>
      <div class="hudBtns">
        <button id="btnNext" class="btn">NEXT</button>
        <button id="btnEnd" class="btn">END</button>
      </div>
    </header>

    <main id="board">
      <div id="fieldTop" class="field"></div>
      <div id="fieldBottom" class="field"></div>

      <section class="zones">
        <div class="zoneRow">
          <div class="zoneLabel">ENEMY E</div>
          <div id="aiE" class="zone"></div>
        </div>
        <div class="zoneRow">
          <div class="zoneLabel">ENEMY C</div>
          <div id="aiC" class="zone"></div>
        </div>

        <div class="zoneRow">
          <div class="zoneLabel">YOUR C</div>
          <div id="pC" class="zone"></div>
        </div>
        <div class="zoneRow">
          <div class="zoneLabel">YOUR E</div>
          <div id="pE" class="zone"></div>
        </div>
      </section>

      <section class="hands">
        <div class="handLabel">YOUR HAND</div>
        <div id="hand" class="hand"></div>

        <div class="handLabel" id="enemyHandLabel">ENEMY HAND</div>
        <div id="aiHand" class="hand enemy"></div>
      </section>
    </main>
  </div>

  <!-- ★重要：この boot は「JS: …」を出さない。表示もしない（CSS/JSで強制非表示） -->
  <div id="boot" aria-hidden="true"></div>

  <script src="./app.js"></script>
</body>
</html>
